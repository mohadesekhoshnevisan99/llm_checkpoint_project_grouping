# SETUP-C SLICE (goal 2026-07-19 gate 6, honest downscale). realnode26_balanced
# is INFEASIBLE for the owner_push arm on the event engine: its whole-shard
# store uploads all couple through STORE_NODE, and at 6528 cohorts that one
# component makes each max-min reallocation O(N^2) -> push stalls (~0.03
# sim-s/wall, >6h). donor_drain is donor-LOCAL (no store coupling) and scales
# (the full-scale drain run confirms). This ~1/6 slice preserves the balanced
# multi-class structure/rates/failure+preemption model so BOTH arms complete
# and the drain-vs-push DIRECTION can be confirmed against mini-C.
simulation:
  seeds:
  - 7
  max_sim_s: 60000.0
cluster:
  node_count: 11232
  gpu_cpu_bandwidth_gbps: 40.0
  network_bandwidth_gbps: 50.0
  local_ssd_bandwidth_gbps: 6.0
  object_store_bandwidth_gbps: 8.0
classes:
  fxl:
    count: 3
    ranks: 1024
    cohorts: 32
    checkpoint_gb_per_rank: 32.0
    iteration_seconds: 30.0
    iterations: 120
    checkpoint_every: 2
    kpeers: 6
    rpo_s: 60.0
  frontier:
    count: 8
    ranks: 256
    cohorts: 16
    checkpoint_gb_per_rank: 16.0
    iteration_seconds: 20.0
    iterations: 180
    checkpoint_every: 2
    kpeers: 6
    rpo_s: 90.0
  standard_g:
    count: 14
    ranks: 64
    cohorts: 8
    checkpoint_gb_per_rank: 8.0
    iteration_seconds: 15.0
    iterations: 240
    checkpoint_every: 2
    kpeers: 6
    rpo_s: 120.0
  standard_c:
    count: 14
    ranks: 64
    cohorts: 8
    checkpoint_gb_per_rank: 8.0
    iteration_seconds: 15.0
    iterations: 240
    checkpoint_every: 2
