# HAND-CHECK scenario: rack failure domains (rack_failure_spec.md + Sam's
# post-spec overrides, 2026-07-27). Small enough that every event is pencil-
# predictable BEFORE running: 3 jobs x 2 nodes, m=1 (cohorts == ranks), NO
# organic failures — the only events are two SCHEDULED node failures and three
# SCHEDULED rack events (zero rack-stream RNG draws: explicit rack + destroy
# lists, full-cohort wipes).
#
# TOPOLOGY (rack_size 2, node_count 6 -> racks 0..2; contiguous packing in
# declaration order):
#   own0  ranks 2 -> nodes 0,1 = RACK 0   (owner under test, kpeers 1)
#   host0 ranks 2 -> nodes 2,3 = RACK 1   (donor pool, kpeers 0, never flushes:
#                                          checkpoint_every 100 > iterations 40)
#   fil0  ranks 2 -> nodes 4,5 = RACK 2   (finishes at t=30 -> idle donor; its
#                                          rack event pins the idle/destroyed
#                                          branch: failed forever, I20)
#
# RATES: gpu_cpu 10.0 (capture 1.0/10 = 0.100 s), nic 2.0, disk 1.0, store
# 500/stream 999, object_store 8.0. gradient_gb_per_rank 0 -> all-reduce 0 s,
# iteration wall exactly 10.000 s. Peer flush k=1: 1.0 GB at min(nic 2, 1 x
# disk 1) = 1.000 s. Peer/replica recovery fetch: donor NIC-out -> own NIC-in
# (disk read not modeled) = 1.0/2.0 = 0.500 s. L3 stitch fetch: store->own
# min(2, 8) = 0.500 s. initial_state fetch: 1.0/8.0 = 0.125 s. dram->GPU
# restore 0.100 s. Drain to L3: min(disk 1, nic 2, stream 999) = 1.000 s.
# ASYNC LANDING (same as handcheck_reboot): the wave queued at iteration N's
# boundary captures only when the GPU frees at the END of iteration N+1, so
# @N lands ~t=(N+1)*10 + 1.1: capture (N+1)*10 -> +0.1, flush -> +1.0.
#
# ARM ours_full (crossjob k=1, donor_drain L3, anti-affinity ON):
#   Each rank stripes 1 piece; anti-affinity excludes the owner's rack 0 ->
#   host0 donors (rack 1), least-loaded stable order: rank0 -> host0-cohort-0,
#   rank1 -> host0-cohort-1. Drains land L3 pieces at the SAME iteration
#   (drain_every_waves = 1, no policy).
#     wave @3 (queued t=30): capture 40.0->40.1, flush 40.1->41.1,
#                            drain 41.1->42.1 (L3 @3 for both ranks)
#   PHASE BEFORE the rack event — scheduled NODE failure own0/c0 after it=5
#   (t=50.1, one capture drift): local DRAM wiped, peers alive:
#     restart 20 -> 70.1; peer fetch 0.5 -> 70.6; restore 0.1 -> 70.7
#     -> tier crossjob_peer @3, rollback 5->3, LOSS 2. Re-exec: it4 80.7,
#        it5 90.7, it6 100.7.
#   RACK EVENT 1 (rack 1 @ t=75, destroy [2]) — after fail#1's recovery
#   completes at 70.7, before the @6 wave: host0's rack goes dark for the rest
#   of the run. own0's @3 pieces die: host0-c0's piece DESTROYED (node 2 =
#   destructive residue), host0-c1's piece DARK; the L3 @3 pieces SURVIVE
#   (store is off-rack). host0 (boundary it=8 at t=80): rack restart 20 -> 100,
#   both cohorts restore initial_state (fetch 0.125 + restore 0.1 -> 100.225),
#   rollback 8->0, LOSS 8 each; host relocates to rack-less replacements ->
#   host END = 100.225 + 40 x 10 = 500.225 (~500.2).
#   PHASE DURING (dark rack) — scheduled NODE failure own0/c0 after it=6
#   (t=100.7, fires BEFORE the @6 wave spawns): local wiped, peer pieces GONE
#   (dark rack), no store copy -> newest AVAILABLE = the drained L3 pieces @3:
#     restart 20 -> 120.7; stitch fetch 0.5 -> 121.2; restore 0.1 -> 121.3
#     -> tier crossjob_peer_l3_stitch @3, rollback 6->3, LOSS 3.
#        Re-exec: it4 131.3, it5 141.3, it6 151.3 (wave @6 queued), it7 161.3;
#        capture @6 161.3->161.4; flush @6 161.4->162.4 lands on the RELOCATED
#        host donors (back on the board since 100.225, rack-less so anti-
#        affinity is satisfied); drain 162.4->163.4; it8 161.4->171.4.
#   RACK EVENT 2 (rack 2 @ t=100, destroy [4,5]): fil0 finished at t=30 ->
#   idle-donor branch: both cohorts failed FOREVER (destructive residue, never
#   return — I20), no restart. Dark nodes leave the AvailabilityBoard
#   (available=False), so reserves after t=100 skip them SILENTLY — like
#   not-yet-arrived Stage-3 jobs, not refusal-counted: refusals stays {}.
#   RACK EVENT 3 (rack 0 @ t=165, destroy []) — after the @6 stripe landed at
#   162.4: own0's OWN rack dies mid-it8. Boundary 171.4: BOTH cohorts restart
#   on replacements and restore from the best OFF-RACK copy — the @6 pieces on
#   the relocated host:
#     restart 20 -> 191.4; fetches 0.5 -> 191.9; restore 0.1 -> 192.0
#     -> tier crossjob_peer @6 x2, rollback 8->6, LOSS 2 each.
#        Re-exec: it7 202.0, it8 212.0, it9 222.0 (wave @9 queued), it10 232.0;
#        capture @9 232.0->232.1; flush 232.1->233.1; drain -> 234.1;
#        it11 242.1, it12 252.1 -> own END 252.1.
#   TOTALS (ours_full): restores {crossjob_peer: 3, crossjob_peer_l3_stitch: 1,
#   initial_state: 2}; failures {node: 2, rack: 2}; losses [2,3,8,8,2,2]
#   (p50 3, max 8); ends own 252.1 / host 500.2 / fil 30.0; rank_flushes 6,
#   l3_drains 6, stitch_recoveries 1, durable_frac 1.0, refusals {};
#   rack: events 3, nodes dark 6, nodes destroyed 3, local
#   copies lost 2 (the two @6 DRAM captures at event 3), ssd pieces
#   destroyed 1 + dark 1 (the @3 stripe at event 1), dram pieces 0,
#   affinity fallbacks 0.
#
# ARM ours_injob_ssd (placement injob_ssd, k=1 ring replica on same-job SSD):
#   own0 rank0 -> replica on own0-cohort-1 (node 1), rank1 -> cohort-0 — SAME
#   RACK by packing (the Gemini-style bet the 2x2 prices). Replica write:
#   1.0 GB at min(nic 2, disk 1) = 1.000 s, same async landing. No cross-job
#   pieces -> owner_push backstop with no store_every => NO L3 AT ALL.
#     replica @3: capture 40.0->40.1, write 40.1->41.1 (r0->c1, r1->c0).
#     fail#1 after it=5 (t=50.1): node loss wipes c0's DRAM AND the HOSTED
#     replica of rank1 on c0 (dies with the host node); rank0 recovers from
#     its replica on c1 (survives OWNER node loss):
#       restart 20 -> 70.1; fetch 0.5 -> 70.6; restore 0.1 -> 70.7
#       -> tier injob_ssd_replica @3, rollback 5->3, LOSS 2.
#     RACK EVENT 1 (rack 1 @75) hits only host0: initial_state x2, END 500.2
#     (identical to ours_full — no pieces there in this arm).
#     fail#2 after it=6 (t=100.7): same source again (the @3 replica on c1 is
#     still the newest copy):
#       -> injob_ssd_replica @3, LOSS 3; recovery 120.7 -> 121.3.
#          Re-exec: it6 151.3 (wave @6 queued), it7 161.3, capture -> 161.4,
#          replica @6 writes 161.4->162.4 (r0->c1, r1->c0), it8 -> 171.4.
#     RACK EVENT 3 (rack 0 @165): kills BOTH own nodes AND both @6 replicas
#     (in-job SSD goes dark with the owner's rack — prediction (2)/(3)):
#       boundary 171.4 -> restart 20 -> 191.4; NOTHING left -> initial_state
#       x2 (fetch 0.125 -> 191.525; restore 0.1 -> 191.625), rollback 8->0,
#       LOSS 8 each. Re-exec 12 iters + 3 late captures (@3 at it4's end,
#       @6 at it7's end, @9 at it10's end): 191.625 + 120 + 0.3 -> own END
#       311.925 (~311.9).
#   TOTALS: restores {injob_ssd_replica: 2, initial_state: 4}; failures
#   {node: 2, rack: 2}; losses [2,3,8,8,8,8] (p50 8, max 8); ends own 311.9 /
#   host 500.2; injob_ssd_flushes 10 (@3 x2, @6 x2 pre-rack; @3/@6/@9 x2
#   post-rack), l3_drains 0, durable_frac 1.0; rack: local copies lost 2, ssd
#   pieces dark 2 (the @6 replicas), destroyed 0, affinity fallbacks 0.
#
# ideal: no checkpoints, no failures, no rack -> own 120.0 / host 400.0 /
# fil 30.0 exactly.
#
# tests/test_rack.py asserts all of the above to the digit; check.sh full runs
# ours_full through trace_validator (I18-I21 exercised on a real trace).

simulation:
  seeds: [7]
  max_sim_s: 800.0
  engine: event

cluster:
  node_count: 6
  gpu_cpu_bandwidth_gbps: 10.0
  network_bandwidth_gbps: 2.0
  local_ssd_bandwidth_gbps: 1.0
  object_store_bandwidth_gbps: 8.0

# rack failure domains (exact knob names per rack_failure_spec.md):
rack_size: 2
rack_weight: 0.0            # no Poisson rack events: scheduled ones only
rack_p_destroy: 0.0         # residue via explicit destroy lists (zero draws)
rack_outage_s: [3600.0, 21600.0]
rack_scheduled:
  - id: rack1-donors-dark   # t=75: own0's donor rack dies; node 2 = residue
    at_s: 75.0
    rack: 1
    destroy: [2]
  - id: rack2-idle-destroyed  # t=100: the finished fil0's rack, both nodes
    at_s: 100.0               # destructive residue -> failed forever (I20)
    rack: 2
    destroy: [4, 5]
  - id: rack0-owner-dark    # t=165: own0's OWN rack -> restart on
    at_s: 165.0             # replacements from the best off-rack copy
    rack: 0
    destroy: []

classes:
  own:                      # the owner under test: 2 nodes, rack 0
    count: 1
    ranks: 2
    cohorts: 2              # m = 1 -> per-rank exact, no cohort math
    checkpoint_gb_per_rank: 1.0
    gradient_gb_per_rank: 0.0   # all-reduce 0 s: iteration wall exactly 10 s
    iteration_seconds: 10.0
    iterations: 12
    checkpoint_every: 3
    kpeers: 1
    rpo_s: 120.0
  host:                     # donor pool on rack 1; never checkpoints itself
    count: 1
    ranks: 2
    cohorts: 2
    checkpoint_gb_per_rank: 1.0
    gradient_gb_per_rank: 0.0
    iteration_seconds: 10.0
    iterations: 40
    checkpoint_every: 100   # > iterations -> no waves
    kpeers: 0
    rpo_s: 1000.0
  fil:                      # finishes at t=30 -> idle donor on rack 2
    count: 1
    ranks: 2
    cohorts: 2
    checkpoint_gb_per_rank: 1.0
    gradient_gb_per_rank: 0.0
    iteration_seconds: 10.0
    iterations: 3
    checkpoint_every: 100
    kpeers: 0
    rpo_s: 1000.0

failures:
  per_node_per_second: 0.0  # NO organic failures: fully deterministic run
  weights: {process: 0.4, reboot: 0.15, node: 0.05, spot: 0.4}
  restart_seconds: {process: 5.0, reboot: 180.0, node: 20.0, spot: 30.0,
                    rack: 20.0}

store:
  in_gbps: 500.0
  out_gbps: 500.0
  disk_gbps: 500.0
  stream_gbps: 999.0
  backstop_s: 300.0

controller:
  slot_period_s: 30.0       # unused: no arm sets slots -> flushes fire at once

scheduled_failures:
  - id: own-node-before-rack    # t=50.1: peers alive -> crossjob_peer @3
    job_id: own0
    cohort: 0
    after_iteration: 5
    failure_type: node
  - id: own-node-during-dark    # t=100.7 (pre-@6-wave): peers dark -> L3 @3
    job_id: own0
    cohort: 0
    after_iteration: 6
    failure_type: node

arms:
  ideal:
    ideal: true
  ours_full:                 # crossjob k=1, donor-drain L3, anti-affinity ON
    kpeers: true
  ours_injob_ssd:            # in-job SSD ring replica (the rack 2x2's 4th cell)
    kpeers: true
    placement: injob_ssd
