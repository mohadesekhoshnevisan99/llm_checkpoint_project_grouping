# handcheck3: failure-heavy variant to exercise f1 snapshots + f3 backstop
# HAND-CHECK #2 (user-designed): imbalanced jobs — 2, 3, 4 nodes.
# Informative because donor supply/demand is asymmetric:
#   big(4) flushing k=2 -> 8 shards onto small+mid = 5 nodes (cap 2) = 10 slots:
#   3 donor disks MUST carry 2 shards -> those streams run at 0.29/2 GB/s.
#   Slowest-stream gating (audit fix #0) predicts flush durations of exactly
#   {1.72 s, 3.45 s}; the old pooled-rate bug would have shown 2.30 s.
#   mid(3)->6 shards over 6 donor nodes and small(2)->4 over 7: all 1.72 s.
# One deterministic preemption of small at ~t>=120 s: its hosted shards must
# DIE with it (audit fix #13), and its own recovery pulls from mid/big donors.
simulation:
  seeds: [7]
cluster:
  node_count: 100
  gpu_cpu_bandwidth_gbps: 12.5
  network_bandwidth_gbps: 1.85
  local_ssd_bandwidth_gbps: 0.29
  object_store_bandwidth_gbps: 8.0
classes:
  small: {count: 1, ranks: 2, cohorts: 2, checkpoint_gb_per_rank: 1.0, iteration_seconds: 10.0, iterations: 60, checkpoint_every: 3, kpeers: 2, rpo_s: 120.0}
  mid:   {count: 1, ranks: 3, cohorts: 3, checkpoint_gb_per_rank: 1.0, iteration_seconds: 10.0, iterations: 60, checkpoint_every: 3, kpeers: 2, rpo_s: 120.0}
  big:   {count: 1, ranks: 4, cohorts: 4, checkpoint_gb_per_rank: 1.0, iteration_seconds: 10.0, iterations: 60, checkpoint_every: 3, kpeers: 2, rpo_s: 120.0}
failures:
  per_node_per_second: 2.0e-4
  weights: {process: 0.4, node: 0.2, spot: 0.4}
  restart_seconds: {process: 5.0, node: 20.0, spot: 30.0}
preemption: {class_prefix: small, every_s: 120.0, seed: 3}
store: {in_gbps: 500.0, out_gbps: 500.0, disk_gbps: 500.0, stream_gbps: 1.0, backstop_s: 120.0}
controller: {slot_period_s: 30.0}
arms:
  ours_full: {kpeers: true, slots: true, controller_epoch_s: 0}
