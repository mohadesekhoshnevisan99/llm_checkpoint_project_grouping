# HAND-CHECK scenario: donor-drain L3 backstop + piece-level stitch recovery
# (goal 2026-07-19, gate 4). Small enough to trace-read; every duration is
# predictable with pencil and paper BEFORE running. 3 jobs x 1 rank each, m=1
# (cohorts = ranks, no cohort compression), no organic failures.
#
# The owner (alpha) stripes its 1.0 GB shard to k=2 donors in OTHER jobs (bravo,
# charlie) -> each hosts a 0.5 GB PIECE. After the wave the donors forward their
# pieces to L3 in the background (donor SSD-read + NIC-out -> store).
#
# PENCIL MATH (Setup rates below: nic 2.0, disk 1.0, gpu_cpu 10.0 GB/s):
#   capture (gpu->dram):  1.0 GB / 10.0            = 0.100 s
#   peer flush k=2:       shard 1.0 GB, 2 streams each [alpha:out, donor:in,
#                         donor:disk]; per-stream cap = min(alpha_nic 2.0,
#                         donor_nic 2.0, donor_disk 1.0) = 1.0 GB/s, and the two
#                         streams share alpha's 2.0 GB/s NIC-out (1.0 each) ->
#                         each 0.5 GB piece at 1.0 GB/s = 0.500 s. flush = 0.500 s
#   L3 drain (per donor): piece 0.5 GB, one stream [donor:disk-read, donor:out],
#                         demand = min(donor_disk 1.0, donor_nic 2.0,
#                         store_stream 1.0) = 1.0 GB/s -> 0.5 / 1.0 = 0.500 s
#                         (both donors drain independently, ~0.500 s each)
#
# The gate-4 PYTHON hand-check (tests/test_donor_drain.py) drives exactly this
# setup, then kills ONE donor before the next wave and fails the owner: recovery
# must STITCH 1 live peer piece + 1 L3 piece at the SAME iteration. Running this
# YAML directly (below) is the no-failure trace-readable demonstrator: peer
# flushes land, then l3_drain events land both pieces on the store.

simulation:
  seeds: [7]
  max_sim_s: 600.0
  engine: event

cluster:
  node_count: 100
  gpu_cpu_bandwidth_gbps: 10.0
  network_bandwidth_gbps: 2.0
  local_ssd_bandwidth_gbps: 1.0
  object_store_bandwidth_gbps: 8.0

classes:
  alpha:      # the OWNER: stripes k=2 to bravo + charlie every 3 iters
    count: 1
    ranks: 1
    cohorts: 1            # m = 1 -> per-rank exact, no cohort math
    checkpoint_gb_per_rank: 1.0
    iteration_seconds: 10.0
    iterations: 12
    checkpoint_every: 3
    kpeers: 2
    rpo_s: 120.0
  bravo:      # donor 1
    count: 1
    ranks: 1
    cohorts: 1
    checkpoint_gb_per_rank: 1.0
    iteration_seconds: 10.0
    iterations: 12
    checkpoint_every: 3
    kpeers: 2
    rpo_s: 120.0
  charlie:    # donor 2
    count: 1
    ranks: 1
    cohorts: 1
    checkpoint_gb_per_rank: 1.0
    iteration_seconds: 10.0
    iterations: 12
    checkpoint_every: 3
    kpeers: 2
    rpo_s: 120.0

failures:
  per_node_per_second: 0.0        # NO random failures: fully predictable run
  weights: {process: 0.4, node: 0.2, spot: 0.4}
  restart_seconds: {process: 5.0, node: 20.0, spot: 30.0}

store:
  in_gbps: 500.0
  out_gbps: 500.0
  disk_gbps: 500.0
  stream_gbps: 1.0
  backstop_s: 300.0

controller:
  slot_period_s: 30.0

# default backstop is donor_drain (goal); the push arm is the legacy comparator.
arms:
  ours_full:   {kpeers: true, slots: true, controller_epoch_s: 0}
  ours_push:   {kpeers: true, slots: true, controller_epoch_s: 0, backstop: owner_push}
