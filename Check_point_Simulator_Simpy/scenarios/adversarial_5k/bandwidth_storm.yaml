# Exactly 5,000 logical nodes. Donors are plentiful, but large synchronized
# checkpoints exceed NIC, disk, and shared-store service capacity. Useful work
# is ten minutes; the hazard is raised so the short run still exercises restore.
simulation:
  seeds: [7]
  max_sim_s: 10000.0
  engine: event

cluster:
  node_count: 5000
  gpu_cpu_bandwidth_gbps: 40.0
  network_bandwidth_gbps: 10.0
  local_ssd_bandwidth_gbps: 1.0
  object_store_bandwidth_gbps: 320.0

classes:
  storm:
    count: 20
    ranks: 250
    cohorts: 5
    checkpoint_gb_per_rank: 32.0
    iteration_seconds: 15.0
    iterations: 40
    checkpoint_every: 2
    kpeers: 4
    rpo_s: 30.0
    rates: {nic: 10.0, disk: 1.0}

failures:
  per_node_per_second: 2.4e-6
  weights: {process: 0.1, node: 0.45, spot: 0.45}
  restart_seconds: {process: 5.0, node: 20.0, spot: 30.0}

store:
  in_gbps: 320.0
  out_gbps: 320.0
  disk_gbps: 320.0
  stream_gbps: 4.0

controller:
  slot_period_s: 60.0

arms:
  jit: {baseline: jit}
  checkfreq: {baseline: checkfreq}
  gemini: {baseline: gemini}
  megascale: {baseline: megascale}
  checknrun: {baseline: checknrun}
  naive1000_all: {kpeers: true, slots: true, cadence_s: 1000.0}
  naive10_100:
    kpeers: true
    slots: true
    cadence_l1_s: 10.0
    cadence_l2_s: 100.0
    cadence_l3_s: 100.0
  ideal: {ideal: true, kpeers: false}
