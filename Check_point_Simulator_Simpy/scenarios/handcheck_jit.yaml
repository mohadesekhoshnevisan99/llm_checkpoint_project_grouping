# handcheck_jit.yaml — Just-In-Time checkpointing (EuroSys'24) single-failure
# signature. NO preemption here so every loss entry comes from a single
# node/process failure and the exactly-one-iteration property is assertable
# as lost_iters_p50 == lost_iters_max == 1. (Whole-job eviction = total loss
# is exercised separately in handcheck_jit_evict.yaml.)
#
# SIGNATURE to hand-check in the trace:
#   * ZERO Checkpoint-category events: no captures, no flushes, no store —
#     JIT does no periodic checkpointing at all (their zero-overhead claim);
#   * every single failure recovers by draining ONE 1.0 GB DRAM snapshot from
#     a surviving DP replica over the NIC (jit_survivor_dram_drain), then a
#     full DRAM->GPU restore; exactly 1 iteration lost per failure.
simulation:
  seeds: [7]
  max_sim_s: 400.0
cluster:
  node_count: 100
  gpu_cpu_bandwidth_gbps: 12.5
  network_bandwidth_gbps: 1.85
  local_ssd_bandwidth_gbps: 0.29
  object_store_bandwidth_gbps: 8.0
classes:
  small:  {count: 1, ranks: 3, cohorts: 3, checkpoint_gb_per_rank: 1.0, iteration_seconds: 4.0, iterations: 40, checkpoint_every: 2, kpeers: 2, gradient_gb_per_rank: 0.5, rpo_s: 120.0}
  steady: {count: 1, ranks: 4, cohorts: 4, checkpoint_gb_per_rank: 1.0, iteration_seconds: 4.0, iterations: 40, checkpoint_every: 2, kpeers: 2, gradient_gb_per_rank: 0.5, rpo_s: 120.0}
failures:
  per_node_per_second: 5.0e-3
  weights: {process: 0.4, node: 0.4, spot: 0.2}
  restart_seconds: {process: 5.0, node: 10.0, spot: 15.0}
store: {in_gbps: 500.0, out_gbps: 500.0, disk_gbps: 500.0, stream_gbps: 1.0}
controller: {slot_period_s: 30.0}
arms:
  jit: {baseline: jit}
