# TRUE-RATE variant (E8): named baselines at the UNACCELERATED failure rate
# — their fixed cadences (30 min etc.) were designed for this world.
# ============================================================================
# SETUP B + Tier-1 NAMED BASELINES — realnode26.yaml with the five published
# baseline policies as arms (checkpointing/baselines.py) next to our arms.
# Solved per-class cadences (iterations) under these rates, for reference:
#   checkfreq (<=3.5% visible): 1 for every class (2026 captures are fast)
#   checknrun (fixed 30 min):   fxl 60, frontier 89, standard_g 119,
#                               standard_c 118, be 175, mega 30
#   megascale (fixed 300 s):    fxl 10, frontier 15, standard 20, be 29, mega 5
#   gemini: every iteration; jit: never (recovers from surviving DP replicas)
# ============================================================================
# Same 2026 workload as realwidth73.yaml (Setup A), expressed in NODES:
# ranks = nodes = GPUs/8; per-node checkpoint = 8 GPUs' sharded state (large
# shards amplify per-node volumes 8x while the shared store pipe stays fixed).
# Rates are ASSUMED 2026 datacenter hardware — stated openly, in contrast to
# Setup A whose per-node rates are MEASURED on our T4 fleet. Both setups run
# every experiment; the paper picks per-figure and keeps the other as the
# sensitivity check ("conclusions are not a hardware-assumption artifact").
# Horizon: ~2 h simulated per job (couple-of-hours standard, user 2026-07-11).

simulation:
  seeds: [7, 11, 13, 17, 23]

cluster:
  node_count: 30000                # jobs claim 24,672 nodes (197,376 GPUs)
  gpu_cpu_bandwidth_gbps: 40.0     # 8-GPU node aggregate snapshot to host DRAM
  network_bandwidth_gbps: 50.0     # 400 GbE
  local_ssd_bandwidth_gbps: 6.0    # PCIe5 NVMe sustained write
  object_store_bandwidth_gbps: 8.0 # legacy field: initial-state warm pull only

# ranks = NODES here (8 GPUs each). checkpoint_gb_per_rank = per-NODE shard.
classes:
  fxl:        # 3 x 8,192 GPUs = 3 x 1,024 nodes; 32 GB/node -> 32.8 TB/wave
    count: 3
    ranks: 1024
    cohorts: 64                    # m = 16 nodes/cohort
    checkpoint_gb_per_rank: 32.0
    iteration_seconds: 30.0
    iterations: 240                # ~7,200 s horizon
    checkpoint_every: 2
    kpeers: 2
    rpo_s: 60.0
  frontier:   # 12 x 2,048 GPUs = 12 x 256 nodes
    count: 12
    ranks: 256
    cohorts: 32                    # m = 8
    checkpoint_gb_per_rank: 16.0
    iteration_seconds: 20.0
    iterations: 360
    checkpoint_every: 2
    kpeers: 2
    rpo_s: 90.0
  standard_g: # 15 x 512 GPUs = 15 x 64 nodes, current-gen
    count: 15
    ranks: 64
    cohorts: 16                    # m = 4
    checkpoint_gb_per_rank: 8.0
    iteration_seconds: 15.0
    iterations: 480
    checkpoint_every: 2
    kpeers: 2
    rpo_s: 120.0
  standard_c: # 15 x 512 GPUs on older-gen nodes (mixed fleet, half rates)
    count: 15
    ranks: 64
    cohorts: 16
    checkpoint_gb_per_rank: 8.0
    iteration_seconds: 15.0
    iterations: 480
    checkpoint_every: 2
    kpeers: 2
    rpo_s: 120.0
    rates: {nic: 25.0, disk: 3.0}
  be:         # 28 x 64 GPUs = 28 x 8 nodes, preemptible, older-gen
    count: 28
    ranks: 8
    cohorts: 8                     # m = 1 (exact per-node)
    checkpoint_gb_per_rank: 3.2
    iteration_seconds: 10.0
    iterations: 720
    checkpoint_every: 2
    kpeers: 2
    rpo_s: 120.0
    rates: {nic: 25.0, disk: 3.0}
  mega:       # 1 x 131,072 GPUs = 16,384 nodes; 4 GB/node -> 65.5 TB/wave
    count: 1
    ranks: 16384
    cohorts: 128                   # m = 128
    checkpoint_gb_per_rank: 4.0
    iteration_seconds: 60.0
    iterations: 120
    checkpoint_every: 2
    kpeers: 2
    rpo_s: 60.0

failures:
  # per-GPU rate as Setup A (LLaMA-3-derived, ~18x accelerated) x 8 GPUs/node
  per_node_per_second: 4.5e-8   # TRUE Llama-3-derived rate (no x18 acceleration): fair to fixed real-world cadences
  weights: {process: 0.4, node: 0.2, spot: 0.4}
  restart_seconds: {process: 5.0, node: 20.0, spot: 30.0}

preemption:
  class_prefix: be
  every_s: 120.0
  seed: 3

store:
  # same shared-store provisioning as Setup A (a cluster service does not get
  # faster because compute nodes did) — per-node volumes are 8x, so pressure
  # on the store GROWS in this setup; stream cap: 2026 multipart client
  in_gbps: 500.0
  out_gbps: 500.0
  disk_gbps: 500.0
  stream_gbps: 2.0

controller:
  slot_period_s: 60.0

arms:
  ours_full:   {kpeers: true, slots: true, controller_epoch_s: 120.0}
  peer_react:  {kpeers: true, random_phases: true}
  local_only:  {kpeers: false}
  store:       {kpeers: true, store_mode: true}
  # Tier-1 named baselines (each with its paper's advantage; see baselines.py)
  gemini:      {baseline: gemini}      # in-job peer-DRAM replication, every iter
  checkfreq:   {baseline: checkfreq}   # local SSD, profiled <=3.5% cadence
  checknrun:   {baseline: checknrun}   # store, 30-min cadence, 0.1x diff+quant bytes
  megascale:   {baseline: megascale}   # store, fixed 300 s async full-size flush
  jit:         {baseline: jit}         # no periodic ckpts; survivor drain on failure
