    cadence_l2_s: 125.0
    cadence_l3_s: 625.0
  peer_semi100:
    kpeers: true
    random_phases: true
    cadence_l1_s: 25.0
    cadence_l2_s: 125.0
    cadence_l3_s: 625.0
  peerph_semi100:
    kpeers: true
    slots: true
    cadence_l1_s: 25.0
    cadence_l2_s: 125.0
    cadence_l3_s: 625.0
  semi300:
    kpeers: false
    cadence_l1_s: 75.0
    cadence_l2_s: 250.0
    cadence_l3_s: 750.0
  peer_semi300:
    kpeers: true
    random_phases: true
    cadence_l1_s: 75.0
    cadence_l2_s: 250.0
    cadence_l3_s: 750.0
  peerph_semi300:
