# rack-failure variant of miniC_ablation_full.yaml (rack_failure_spec.md +
# Sam's post-spec overrides 2026-07-27): knobs rack_size=4 rack_weight=0.05 rack_p_destroy=0.01 rack_outage_s=[3600.0, 21600.0].
# Rack knobs live BOTH top-level (run_scenario.py keys the sim feature on
# top-level rack_size) and under failures: (gp_policy.py build_model_inputs
# prices the lambda_rack slice from the failures block). Physics/arms otherwise
# IDENTICAL to miniC_ablation_full.yaml (same seeds, horizon, classes).
