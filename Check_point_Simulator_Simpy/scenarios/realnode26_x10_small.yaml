# Mega-dominant 2026 fleet (table setup a), scaled to about one tenth.
# Job counts and per-node hardware/state stay fixed. Ranks and simulator cohorts
# per job are divided by ten (rounded, minimum one). Shared store capacity is
# divided by ten so aggregate checkpoint pressure remains comparable.
simulation:
  seeds: [7]
  max_sim_s: 60000.0
  engine: event

cluster:
  node_count: 3000
  gpu_cpu_bandwidth_gbps: 40.0
  network_bandwidth_gbps: 50.0
  local_ssd_bandwidth_gbps: 6.0
  object_store_bandwidth_gbps: 8.0

classes:
  fxl:
    count: 3
    ranks: 102
    cohorts: 6
    checkpoint_gb_per_rank: 32.0
    iteration_seconds: 30.0
    iterations: 240
    checkpoint_every: 2
    kpeers: 2
    rpo_s: 60.0
  frontier:
    count: 12
    ranks: 26
    cohorts: 3
    checkpoint_gb_per_rank: 16.0
    iteration_seconds: 20.0
    iterations: 360
    checkpoint_every: 2
    kpeers: 2
    rpo_s: 90.0
  standard_g:
    count: 15
    ranks: 6
    cohorts: 2
    checkpoint_gb_per_rank: 8.0
    iteration_seconds: 15.0
    iterations: 480
    checkpoint_every: 2
    kpeers: 2
    rpo_s: 120.0
  standard_c:
    count: 15
    ranks: 6
    cohorts: 2
    checkpoint_gb_per_rank: 8.0
    iteration_seconds: 15.0
    iterations: 480
    checkpoint_every: 2
    kpeers: 2
    rpo_s: 120.0
    rates: {nic: 25.0, disk: 3.0}
  be:
    count: 28
    ranks: 1
    cohorts: 1
    checkpoint_gb_per_rank: 3.2
    iteration_seconds: 10.0
    iterations: 720
    checkpoint_every: 2
    kpeers: 2
    rpo_s: 120.0
    rates: {nic: 25.0, disk: 3.0}
  mega:
    count: 1
    ranks: 1638
    cohorts: 13
    checkpoint_gb_per_rank: 4.0
    iteration_seconds: 60.0
    iterations: 120
    checkpoint_every: 2
    kpeers: 2
    rpo_s: 60.0

failures:
  per_node_per_second: 4.5e-8
  weights: {process: 0.4, node: 0.2, spot: 0.4}
  restart_seconds: {process: 5.0, node: 20.0, spot: 30.0}

preemption:
  class_prefix: be
  every_s: 120.0
  seed: 3

store:
  in_gbps: 50.0
  out_gbps: 50.0
  disk_gbps: 50.0
  stream_gbps: 2.0

controller:
  slot_period_s: 60.0

arms:
  jit: {baseline: jit}
  checkfreq: {baseline: checkfreq}
  gemini: {baseline: gemini}
  megascale: {baseline: megascale}
  checknrun: {baseline: checknrun}
  naive1000_all: {kpeers: true, slots: true, cadence_s: 1000.0}
  naive10_100:
    kpeers: true
    slots: true
    cadence_l1_s: 10.0
    cadence_l2_s: 100.0
    cadence_l3_s: 100.0
  ideal: {ideal: true, kpeers: false}
