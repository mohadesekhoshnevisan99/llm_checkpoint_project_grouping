# handcheck_megascale.yaml — MegaScale (NSDI'24) production-status-quo signature:
# DRAM stage + async FULL-SIZE store flush on the fixed 300 s cadence, store
# recovery. m=1 (cohorts==ranks), organic failures on. The 300 s cadence is the
# arm's own fixed convention (no cadence_s override here — the fixed cadence IS
# the signature), so the horizon spans two flush waves.
#
# SIGNATURE to hand-check in the trace:
#   * wall = 10 + 2*(1/2)*4/1.85 = 12.16 s -> checkpoint_every =
#     round(300/12.16) = 25: store flushes only at iteration multiples of 25;
#   * store writes are FULL-SIZE (4.0 GB = the whole shard, no compression);
#   * failures after a flush recover from the store with a FULL-SIZE fetch;
#     failures before the first flush (t < ~304 s) honestly fall to
#     initial_state — the exposure of a fixed 300 s cadence.
simulation:
  seeds: [7]
  max_sim_s: 1500.0
cluster:
  node_count: 100
  gpu_cpu_bandwidth_gbps: 12.5
  network_bandwidth_gbps: 1.85
  local_ssd_bandwidth_gbps: 0.29
  object_store_bandwidth_gbps: 8.0
classes:
  prod: {count: 2, ranks: 2, cohorts: 2, checkpoint_gb_per_rank: 4.0, iteration_seconds: 10.0, iterations: 60, checkpoint_every: 2, kpeers: 2, rpo_s: 120.0}
failures:
  per_node_per_second: 1.5e-3
  weights: {process: 0.2, node: 0.5, spot: 0.3}
  restart_seconds: {process: 5.0, node: 10.0, spot: 15.0}
store: {in_gbps: 500.0, out_gbps: 500.0, disk_gbps: 500.0, stream_gbps: 1.0}
controller: {slot_period_s: 30.0}
arms:
  megascale: {baseline: megascale}
