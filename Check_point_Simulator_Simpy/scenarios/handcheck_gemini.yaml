# handcheck_gemini.yaml — GEMINI (SOSP'23) in-job peer-DRAM replication signature.
# Small shards (replication finishes well inside an iteration), m=1 (cohorts==ranks,
# exact per-node), organic failures + one preemptible class. Horizon << 5 sim-min.
#
# SIGNATURE to hand-check in the trace:
#   * every iteration each rank replicates its FULL shard to kpeers=2 in-job peers
#     (path "gemini_replica"); replication uses NIC capacity but is NOT coupled to
#     the all-reduce slowdown (interleaving) and never touches a donor/store;
#   * process/node failures recover from DRAM (own copy, else surviving replica);
#   * whole-job EVICTION wipes every holder node -> all replicas die with them ->
#     recovery falls to initial_state (the replicas-die-with-holders property).
#
# NOTE: this file isolates the IN-MEMORY tiers. GEMINI's third tier (its remote
# persistent store) is real and enabled by default, but at the default 600 s
# cadence it works out to 138 iterations here — more than this file's 30-iteration
# horizon — so no upload ever lands and eviction still ends at initial_state.
# That is a property of THIS horizon, not of GEMINI: with the store tier reachable
# an eviction recovers from the store instead. See handcheck_gemini_evict.yaml,
# which shrinks gemini_store_every_s so the backstop is exercised.
simulation:
  seeds: [7]
  max_sim_s: 500.0
cluster:
  node_count: 100
  gpu_cpu_bandwidth_gbps: 12.5
  network_bandwidth_gbps: 1.85
  local_ssd_bandwidth_gbps: 0.29
  object_store_bandwidth_gbps: 8.0
classes:
  small:    {count: 1, ranks: 3, cohorts: 3, checkpoint_gb_per_rank: 1.0, iteration_seconds: 4.0, iterations: 30, checkpoint_every: 2, kpeers: 2, gradient_gb_per_rank: 0.5, rpo_s: 120.0}
  frontier: {count: 1, ranks: 4, cohorts: 4, checkpoint_gb_per_rank: 1.0, iteration_seconds: 4.0, iterations: 30, checkpoint_every: 2, kpeers: 2, gradient_gb_per_rank: 0.5, rpo_s: 120.0}
failures:
  per_node_per_second: 5.0e-3
  weights: {process: 0.5, node: 0.5, spot: 0.0}
  restart_seconds: {process: 5.0, node: 10.0, spot: 15.0}
preemption: {class_prefix: small, every_s: 60.0, seed: 3}
store: {in_gbps: 500.0, out_gbps: 500.0, disk_gbps: 500.0, stream_gbps: 1.0}
controller: {slot_period_s: 30.0}
arms:
  gemini: {baseline: gemini}
