# SETUP C 'balanced 2026 fleet' (Sam, 2026-07-15): no single job dominates.
# mega = 29% of the cluster (vs 66% in realnode26) -> cross-job striping is
# structurally available to EVERY class. kpeers requests the measured
# k-curve knee (6); the controller caps it per-class by donor capacity.
# Per-job eviction MTBF held at 56 min: the per-job hazard is 1/(every_s*count),
# so with 160 be jobs (vs 28) every_s must SHRINK to 21 s, not grow — spot reclaim
# scales with preemptible CAPACITY (1,280 be nodes here vs 224), so per-node and
# per-job hazard both stay put. (First cut had every_s=685.7 -> 30 h per-job MTBF,
# 32x too gentle; caught because the solver dropped be from every-3 to every-16.)
simulation:
  seeds:
  - 7
  - 11
  - 13
  - 17
  - 23
cluster:
  node_count: 30000
  gpu_cpu_bandwidth_gbps: 40.0
  network_bandwidth_gbps: 50.0
  local_ssd_bandwidth_gbps: 6.0
  object_store_bandwidth_gbps: 8.0
classes:
  fxl:
    count: 16
    ranks: 1024
    cohorts: 64
    checkpoint_gb_per_rank: 32.0
    iteration_seconds: 30.0
    iterations: 240
    checkpoint_every: 2
    kpeers: 6
    rpo_s: 60.0
  frontier:
    count: 48
    ranks: 256
    cohorts: 32
    checkpoint_gb_per_rank: 16.0
    iteration_seconds: 20.0
    iterations: 360
    checkpoint_every: 2
    kpeers: 6
    rpo_s: 90.0
  standard_g:
    count: 80
    ranks: 64
    cohorts: 16
    checkpoint_gb_per_rank: 8.0
    iteration_seconds: 15.0
    iterations: 480
    checkpoint_every: 2
    kpeers: 6
    rpo_s: 120.0
  standard_c:
    count: 80
    ranks: 64
    cohorts: 16
    checkpoint_gb_per_rank: 8.0
    iteration_seconds: 15.0
    iterations: 480
    checkpoint_every: 2
    kpeers: 6
    rpo_s: 120.0
    rates:
      nic: 25.0
      disk: 3.0
  be:
    count: 160
    ranks: 8
    cohorts: 8
    checkpoint_gb_per_rank: 3.2
    iteration_seconds: 10.0
    iterations: 720
    checkpoint_every: 2
    kpeers: 6
    rpo_s: 120.0
    rates:
      nic: 25.0
      disk: 3.0
  mega:
    count: 1
    ranks: 16384
    cohorts: 128
    checkpoint_gb_per_rank: 4.0
    iteration_seconds: 60.0
    iterations: 120
    checkpoint_every: 2
    kpeers: 6
    rpo_s: 60.0
failures:
  per_node_per_second: 4.5e-08
  weights:
    process: 0.4
    node: 0.2
    spot: 0.4
  restart_seconds:
    process: 5.0
    node: 20.0
    spot: 30.0
preemption:
  class_prefix: be
  every_s: 21.0
  seed: 3
store:
  in_gbps: 500.0
  out_gbps: 500.0
  disk_gbps: 500.0
  stream_gbps: 2.0
controller:
  slot_period_s: 60.0
arms:
  ours_full:
    kpeers: true
    slots: true
    controller_epoch_s: 120.0
  peer_react:
    kpeers: true
    random_phases: true
  local_only:
    kpeers: false
  store:
    kpeers: true
    store_mode: true
  gemini:
    baseline: gemini
  checkfreq:
    baseline: checkfreq
  checknrun:
    baseline: checknrun
  megascale:
    baseline: megascale
  jit:
    baseline: jit
