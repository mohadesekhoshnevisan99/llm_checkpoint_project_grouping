# mini-C L1.5 PROFILE (i): CURRENT FRONT-END — 50 GB/s in / 25 GB/s out
# (l15_peer_dram_spec.md goal 2d; napkin l15_peer_dram_napkin.md).
#
# Classes/failures/preemption/store are miniC.yaml VERBATIM. The one deliberate
# addition is the EXPLICIT duplex front-end NIC: the napkin's "current 50/25"
# frontend (400 Gb marketing duplex ~ 200 Gb = 25 GB/s egress per node, 50 GB/s
# ingress) — miniC.yaml's bare network_bandwidth_gbps: 50 is symmetric 50/50 in
# the engine, which IS the high-NIC profile; without this split the two 2d
# profiles would be physically identical and the pre-registered "profile (i)
# ~ tie" prediction untestable. NAPKIN ARITHMETIC AT THESE RATES:
#   k=6 classes: L2 landing 6x6=36 > NIC_out 25 -> NIC-BOUND both tiers,
#                d2 = d1.5 = s/25  => speedup 1.0x (the June rejection's case);
#   k<=3 (mega/donor-edge): L2 k*6 <= 18 < 25 -> disk-bound; L1.5 lands at
#                min(25, k*50) = 25 => up to 2.1x on that wave only.
# So profile (i) pre-registers ~tie or a small freshness-only win.
#
# L1.5 capacity (model:): 1 resident piece per donor rank; byte cap = 2x the
# largest class piece at its configured stripe (fxl 32 GB / k=6 = 5.33 GB ->
# 10.7 GB), per l15_peer_dram_spec.md defaults, stated explicitly.
simulation:
  seeds:
  - 7
  - 11
  - 13
  - 17
  - 23
  max_sim_s: 14400.0
  engine: event
cluster:
  node_count: 760
  gpu_cpu_bandwidth_gbps: 40.0
  network_bandwidth_gbps: 50.0
  local_ssd_bandwidth_gbps: 6.0
  object_store_bandwidth_gbps: 8.0
model:
  dram_host_slots: 1
  dram_host_gb: 10.7
classes:
  mega:
    count: 1
    ranks: 256
    cohorts: 64
    checkpoint_gb_per_rank: 4.0
    iteration_seconds: 60.0
    iterations: 30
    checkpoint_every: 2
    kpeers: 6
    rpo_s: 60.0
    weights_gb_per_rank: 4.0
    rates: {nic: 50.0, nic_out: 25.0}
  fxl:
    count: 4
    ranks: 64
    cohorts: 16
    checkpoint_gb_per_rank: 32.0
    iteration_seconds: 30.0
    iterations: 60
    checkpoint_every: 3
    kpeers: 6
    rpo_s: 60.0
    weights_gb_per_rank: 4.0
    rates: {nic: 50.0, nic_out: 25.0}
  frontier:
    count: 8
    ranks: 16
    cohorts: 8
    checkpoint_gb_per_rank: 16.0
    iteration_seconds: 20.0
    iterations: 90
    checkpoint_every: 8
    kpeers: 6
    rpo_s: 90.0
    weights_gb_per_rank: 4.0
    rates: {nic: 50.0, nic_out: 25.0}
  standard:
    count: 12
    ranks: 8
    cohorts: 8
    checkpoint_gb_per_rank: 8.0
    iteration_seconds: 15.0
    iterations: 120
    checkpoint_every: 15
    kpeers: 6
    rpo_s: 120.0
    weights_gb_per_rank: 4.0
    rates: {nic: 50.0, nic_out: 25.0}
  be:
    count: 12
    ranks: 2
    cohorts: 2
    checkpoint_gb_per_rank: 3.2
    iteration_seconds: 10.0
    iterations: 180
    checkpoint_every: 3
    kpeers: 6
    rpo_s: 120.0
    weights_gb_per_rank: 4.0
    rates: {nic: 50.0, nic_out: 25.0}
failures:
  per_node_per_second: 3.0e-06
  weights:                    # reboot spec 2026-07-21: split old node:0.20 -> 3:1
    process: 0.4
    reboot: 0.15              # DRAM lost, local disk (own SSD + hosted) SURVIVES
    node: 0.05               # true node replace: all node state gone
    spot: 0.4
  restart_seconds:
    process: 5.0
    reboot: 180.0            # source-backed 120-300 s (Delta SC'25 / GCP / Meta)
    node: 20.0
    spot: 30.0
preemption:
  class_prefix: be
  every_s: 50.0
  model: per_job_hazard
  seed: 3
store:
  in_gbps: 60.0
  out_gbps: 60.0
  disk_gbps: 60.0
  stream_gbps: 2.0
  backstop_s: 300.0
controller:
  slot_period_s: 60.0
backstop: donor_drain
arms:
  # best hand-set tiered cadence WITH peer donors (L1/L2/L3 = 500/1100/2900 s,
  # the reboot-staircase winner; same shape as miniC_parallelism's handset)
  handset:
    kpeers: true
    slots: true
    cadence_l1_s: 500.0
    cadence_l2_s: 1100.0
    cadence_l3_s: 2900.0
  # ours / ours+L1.5 run from solved policies (--policy); see
  # ../checkpointing/multilevel/results/miniC_l15/RUNBOOK.md
